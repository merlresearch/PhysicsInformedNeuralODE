seml:
  executable: src/pinode/burgers/pinode_burgers.py
  name: pinode_burgers
  project_root_dir: /data/sholokhov/PhysicsInformedNeuralODE
  conda_environment: merl

slurm:
  experiments_per_job: 2
  max_simultaneous_jobs: 8
  sbatch_options:
    gres: gpu:1       # num GPUs
    mem: 16G          # memory
    cpus-per-task: 4  # num cores
    time: 0-23:00     # max time, D-HH:MM

###### BEGIN PARAMETER CONFIGURATION ######

fixed:
  device: "cuda"
  n_epochs: 500
  n_steps_train: 50
  version: "v4_res_h"
  seed: 43
  shift: 1
  n_snapshots_train: 1024

grid:

  n_latent:
    type: choice
    options:
      - 4
      - 8
      - 16
      - 32

  hidden_width:
    type: choice
    options:
      - 64
      - 128
      - 256
      - 512

  latent_hidden_width:
    type: choice
    options:
      - 64
      - 128
      - 256

  n_latent_layers:
    type: choice
    options:
      - 2
      - 3

  n_layers:
    type: choice
    options:
      - 2
      - 3

  skip_connections:
    type: choice
    options:
      - True
      - False
